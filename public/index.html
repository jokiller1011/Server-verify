<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesper Server Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card" id="form-step">
        <h1>Vesper Verification</h1>
        <p>Please enter your username to verify.</p>
        <input type="text" id="username" placeholder="Enter your username" required>
        
        <!-- The CAPTCHA is now solved automatically when you click Verify -->
        <div id="error-box" class="error-box hidden"></div>
        <button id="submit-btn">Verify</button>
    </div>

    <div class="card hidden" id="success-step">
        <div class="success-text">Your Verified!</div>
        <p>A server admin will review your verification shortly, then verify you.</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
