<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesper Server Verification</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/cap-widget"></script>
</head>
<body>
    <div class="card" id="form-step">
        <img src="logo.svg" alt="Vesper Logo" class="profile-icon">
        <h1>Vesper Verification</h1>
        <p id="instruction-text">Please enter your username to verify.</p>
        <input type="text" id="username" placeholder="Enter your username" required>
        
        <!-- Logged-in message (hidden by default) -->
        <p id="logged-in-message" class="hidden">You are logged in as <strong id="logged-in-username"></strong></p>

        <div class="captcha-container">
            <cap-widget 
                id="cap-widget"
                data-cap-api-endpoint="/cap/"
                onsolve="onCapSolve(event)">
            </cap-widget>
        </div>

        <div id="error-box" class="error-box hidden"></div>
        <button id="submit-btn" disabled>Verify</button>
    </div>

    <div class="card hidden" id="success-step">
        <img src="logo.svg" alt="Vesper Logo" class="profile-icon">
        <div class="success-text">You're Verified!</div>
        <p>A server admin will review your verification shortly, then verify you.</p>
    </div>

    <a href="https://github.com/jokiller1011/Server-verify" target="_blank" class="github-link" aria-label="GitHub Repository">
        <svg viewBox="0 0 16 16" width="36" height="36" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
    </a>

    <script src="app.js"></script>
</body>
</html>
